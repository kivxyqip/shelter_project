{% extends 'project/base.html' %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 20px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <span style="font-size: 50px;">🔐</span>
                <h2 class="fw-bold mt-2">{% trans "Вхід" %}</h2>
                <p class="text-muted">{% trans "Раді бачити вас знову!" %}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 12px; background: #ff6b6b; border: none;">
                        {% trans "Увійти" %}
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="small">{% trans "Ще немає аккаунту?" %}
                    <a href="{% url 'register' %}" style="color: #ff6b6b; font-weight: bold; text-decoration: none;">{% trans "Зареєструватися" %}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
