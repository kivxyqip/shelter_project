{% extends 'project/base.html' %}
{% load i18n %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 20px;">
        <div class="card-body p-5 text-center">
            <span style="font-size: 50px;">✅</span>
            <h2 class="fw-bold mt-2">{% trans "Успіх!" %}</h2>
            <p class="text-muted">{% trans "Ваш пароль було успішно змінено." %}</p>

            <div class="d-grid gap-2 mt-4">
                <a href="{% url 'cats_index' %}" class="btn btn-primary btn-lg" style="border-radius: 12px; background: #ff6b6b; border: none;">
                    {% trans "На головну" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
