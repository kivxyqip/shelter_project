{% extends 'project/base.html' %}
{% load i18n %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    <h2>{% trans "Інформація про притулок" %}</h2>
    <hr>
    <form method="post">
        {% csrf_token %}
        <style>
            form p { margin-bottom: 15px; display: flex; flex-direction: column; }
            input, select, textarea { padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin-top: 5px; }
        </style>
        {{ form.as_p }}
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold;">
                {% trans "Зберегти" %}
            </button>
            <a href="{% url 'shelter_list' %}" style="text-decoration: none; color: #777; padding: 12px;">{% trans "Скасувати" %}</a>
        </div>
    </form>
</div>
{% endblock %}
