{% extends 'project/base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5" style="max-width: 600px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    <h2>{% trans "Додати медичний запис для" %} {{ cat.name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Джанго сам виведе всі поля -->

        <button type="submit" class="btn btn-success" style="border-radius: 12px; padding: 10px 25px;">
            {% trans "Зберегти" %}
        </button>
        <a href="{% url 'cat_detail' cat_id %}" class="btn btn-secondary" style="border-radius: 12px; padding: 10px 25px; margin-left: 10px;">
            {% trans "Скасувати" %}
        </a>
    </form>
</div>
{% endblock %}
